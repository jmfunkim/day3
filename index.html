<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html, body { height: 100%; margin: 0; background: #0b0f1a; color: #e8ecf5; font-family: sans-serif; }
        body { display: flex; flex-direction: column; }
        #bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; background: #121829; border-bottom: 1px solid #263050; }
        #bar h1 { font-size: 18px; margin: 0 8px 0 0; }
        select, button { background: #1b2340; color: #e8ecf5; border: 1px solid #34406a; border-radius: 6px; padding: 6px 10px; }
        #stats { margin-left: auto; font-size: 14px; color: #9fb0e0; }
        #map { flex: 1; background: #0b0f1a; }
        /* 지도를 어둡게: 타일에 반전 필터 */
        .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.75) contrast(0.9) saturate(0.6); }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #121829; color: #e8ecf5; }
        .leaflet-popup-content a { color: #7fb2ff; }
        #legend { position: absolute; right: 12px; bottom: 28px; z-index: 1000; background: #121829cc; border: 1px solid #263050; border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.7; }
        #legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; }
        /* 규모 6 이상은 파문이 번지는 효과 */
        .pulse { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ff3b5c; animation: pulse 1.8s ease-out infinite; }
        @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(9); opacity: 0; } }
    </style>
</head>
<body>
    <div id="bar">
        <h1>🌍 실시간 지진 지도</h1>
        <select id="feed">
            <option value="all_hour">지난 1시간 (전체)</option>
            <option value="all_day" selected>지난 24시간 (전체)</option>
            <option value="2.5_week">지난 7일 (규모 2.5↑)</option>
            <option value="4.5_month">지난 30일 (규모 4.5↑)</option>
        </select>
        <select id="mag">
            <option value="0">모든 규모</option>
            <option value="2">규모 2 이상</option>
            <option value="4">규모 4 이상</option>
            <option value="5">규모 5 이상</option>
            <option value="6">규모 6 이상</option>
        </select>
        <button id="reload">새로고침</button>
        <span id="stats">불러오는 중...</span>
    </div>
    <div id="map"></div>
    <div id="legend">
        <b>진원 깊이</b><br>
        <i style="background:#ff3b5c"></i>얕음 (70km 미만)<br>
        <i style="background:#ffb13b"></i>중간 (70~300km)<br>
        <i style="background:#3bb0ff"></i>깊음 (300km 이상)<br>
        원 크기 = 규모
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const URL_BASE = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/"
        const map = L.map("map", { worldCopyJump: true }).setView([25, 130], 3)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 12,
            attribution: "&copy; OpenStreetMap contributors | 지진 데이터: USGS",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const $ = (id) => document.getElementById(id)
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
        const color = (depth) => (depth < 70 ? "#ff3b5c" : depth < 300 ? "#ffb13b" : "#3bb0ff")

        let quakes = []

        const draw = () => {
            layer.clearLayers()
            const min = Number($("mag").value)
            const shown = quakes.filter((q) => q.properties.mag >= min)
            let strongest = null
            for (const q of shown) {
                const [lng, lat, depth] = q.geometry.coordinates
                const { mag, place, time, url } = q.properties
                if (!strongest || mag > strongest.properties.mag) strongest = q
                const info = `<b>규모 ${mag}</b><br>${esc(place)}<br>깊이 ${depth} km<br>` +
                    `${new Date(time).toLocaleString("ko-KR")}<br><a href="${esc(url)}" target="_blank" rel="noopener">상세 보기</a>`
                L.circleMarker([lat, lng], {
                    radius: 2 + Math.max(mag, 0) ** 1.7,
                    color: color(depth), weight: 1, fillColor: color(depth), fillOpacity: 0.45,
                }).addTo(layer).bindPopup(info)
                if (mag >= 6) {
                    L.marker([lat, lng], { icon: L.divIcon({ className: "", html: '<div class="pulse"></div>', iconSize: [12, 12] }), interactive: false }).addTo(layer)
                }
            }
            $("stats").textContent = shown.length
                ? `${shown.length}건 · 최대 규모 ${strongest.properties.mag} (${strongest.properties.place})`
                : "조건에 맞는 지진이 없습니다"
        }

        const load = async () => {
            $("stats").textContent = "불러오는 중..."
            try {
                const res = await fetch(URL_BASE + $("feed").value + ".geojson")
                if (!res.ok) throw new Error("HTTP " + res.status)
                quakes = (await res.json()).features.filter((q) => q.properties.mag !== null)
                draw()
            } catch (e) {
                $("stats").textContent = "데이터를 불러오지 못했습니다: " + e.message
            }
        }

        $("feed").onchange = load
        $("mag").onchange = draw
        $("reload").onclick = load
        load()
        setInterval(load, 60000)   // 1분마다 자동 갱신
    </script>
</body>
</html>
