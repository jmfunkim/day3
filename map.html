<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { padding: 8px; display: flex; gap: 8px; align-items: center; }
        #map { height: 60vh; }
        #list { margin: 8px; padding-left: 20px; }
    </style>
</head>
<body>
    <div id="bar">
        <select id="area">
            <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
        </select>
        <select id="indoor">
            <option value="">실내/야외 전체</option>
            <option value="true">실내</option>
            <option value="false">야외</option>
        </select>
        <input id="text" placeholder="예: 서쪽 실내">
        <button id="go">찾기</button>
        <span id="msg"></span>
    </div>
    <div id="map"></div>
    <ol id="list"></ol>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="api/data.js"></script>
    <script src="api/tools.js"></script>
    <script>
        const map = L.map("map").setView([33.38, 126.55], 10)
        // tile.openstreetmap.org 는 file:// 로 열면(Referer 없음) 403 으로 막는다. http:// 로 열면 OSM, file:// 이면 키 없는 Esri 타일을 쓴다.
        const isFile = location.protocol === "file:"
        L.tileLayer(
            isFile
                ? "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"
                : "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 18,
                attribution: isFile ? "Tiles &copy; Esri" : "&copy; OpenStreetMap contributors",
            }
        ).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const search = () => {
            if (typeof find_spots !== "function") {
                document.getElementById("msg").textContent = "api/data.js, api/tools.js 를 불러오지 못했습니다 (map.html 과 같은 폴더에 api 폴더가 있어야 합니다)"
                return
            }
            // 입력창의 말("서쪽 실내")에서 지역과 실내/야외를 골라 선택값에 반영한다.
            const text = document.getElementById("text").value
            for (const a of ["동쪽", "서쪽", "서귀포", "제주시"]) if (text.includes(a)) document.getElementById("area").value = a
            if (text.includes("실내")) document.getElementById("indoor").value = "true"
            else if (text.includes("야외")) document.getElementById("indoor").value = "false"

            const input = { area: document.getElementById("area").value }
            const indoor = document.getElementById("indoor").value
            if (indoor !== "") input.indoor = indoor === "true"

            const { total, spots, error } = find_spots(input)
            layer.clearLayers()
            const list = document.getElementById("list")
            list.innerHTML = ""
            document.getElementById("msg").textContent = error || `${total}곳 중 ${spots.length}곳 표시`
            if (error || !spots.length) return

            for (const s of spots) {
                const place = s.area + " · " + (s.indoor ? "실내" : "야외") + " · " + s.description
                L.marker([s.lat, s.lng]).addTo(layer).bindPopup(`<b>${s.name}</b><br>${place}`)
                const li = document.createElement("li")
                li.textContent = `${s.name} (${place})`
                list.appendChild(li)
            }
            map.fitBounds(spots.map((s) => [s.lat, s.lng]), { padding: [30, 30] })
        }
        document.getElementById("go").onclick = search
        document.getElementById("text").onkeydown = (e) => { if (e.key === "Enter") search() }
        document.getElementById("area").onchange = document.getElementById("indoor").onchange = () => {
            document.getElementById("text").value = ""
            search()
        }
        search()   // 처음 열 때도 바로 표시
    </script>
</body>
</html>
