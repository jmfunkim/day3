<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 Agent</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html, body { height: 100%; margin: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; }
        #bar { display: flex; gap: 8px; padding: 10px; background: #0f2a3d; color: #fff; align-items: center; }
        #bar h1 { font-size: 17px; margin: 0; white-space: nowrap; }
        #q { flex: 1; padding: 8px 10px; border: 0; border-radius: 6px; font-size: 15px; }
        #go { padding: 8px 16px; border: 0; border-radius: 6px; background: #ff7a45; color: #fff; font-size: 15px; cursor: pointer; }
        #go:disabled { opacity: .5; cursor: wait; }
        #main { flex: 1; display: flex; min-height: 0; }
        #map { flex: 1; }
        #side { width: 340px; overflow-y: auto; padding: 12px; box-sizing: border-box; background: #f6f8fa; font-size: 14px; }
        #answer { white-space: pre-wrap; line-height: 1.6; }
        .step { margin: 4px 0; padding: 6px 8px; border-radius: 6px; background: #e3eefb; font-size: 13px; }
        .step.weather { background: #fff1d6; }
        h2 { font-size: 13px; color: #556; margin: 14px 0 6px; }
        @media (max-width: 700px) { #main { flex-direction: column-reverse; } #side { width: auto; max-height: 45%; } }
    </style>
</head>
<body>
    <div id="bar">
        <h1>🏝️ 제주 여행 추천 Agent</h1>
        <input id="q" value="이번 주말 서쪽에서 갈 만한 곳 추천해줘" maxlength="300">
        <button id="go">추천받기</button>
    </div>
    <div id="main">
        <div id="map"></div>
        <div id="side">
            <div id="answer">질문을 입력하면 agent가 날씨(get_weather)와 장소(find_spots)를 직접 조회해서 추천합니다.</div>
            <h2>agent가 부른 도구</h2>
            <div id="trace">-</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const $ = (id) => document.getElementById(id)
        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap contributors | 날씨: Open-Meteo",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const ask = async () => {
            const question = $("q").value.trim()
            if (!question) return
            $("go").disabled = true
            $("answer").textContent = "agent가 도구를 호출하는 중..."
            $("trace").textContent = "-"
            layer.clearLayers()
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ question }),
                })
                const data = await res.json()
                if (!res.ok) throw new Error(data.error || "HTTP " + res.status)
                show(data)
            } catch (e) {
                $("answer").textContent = "오류: " + e.message
            }
            $("go").disabled = false
        }

        const show = ({ answer, trace, spots }) => {
            $("answer").textContent = answer
            $("trace").innerHTML = ""
            for (const t of trace) {
                const div = document.createElement("div")
                div.className = "step" + (t.name === "get_weather" ? " weather" : "")
                div.textContent = `${t.name === "get_weather" ? "☁️" : "📍"} ${t.name}(${JSON.stringify(t.input)})`
                $("trace").appendChild(div)
            }
            // 답변에서 실제로 언급한 장소만 지도에 찍고, 없으면 조회된 장소 전부를 찍는다.
            const picked = spots.filter((s) => answer.includes(s.name))
            const marks = picked.length ? picked : spots
            for (const s of marks) {
                L.marker([s.lat, s.lng]).addTo(layer).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.area)} · ${s.indoor ? "실내" : "야외"} · ${esc(s.description)}`)
            }
            if (marks.length) map.fitBounds(marks.map((s) => [s.lat, s.lng]), { padding: [40, 40], maxZoom: 12 })
        }
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))

        $("go").onclick = ask
        $("q").onkeydown = (e) => { if (e.key === "Enter") ask() }
    </script>
</body>
</html>
